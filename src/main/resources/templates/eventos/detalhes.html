<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eventos - Detalhes</title>
</head>
<body>
    <h1>Detalhes</h1>

    <p th:text="${evento.titulo}"></p>

</html>
